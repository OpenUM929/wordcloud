[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordcloud-project"
version = "2.0.0"
description = "한국어 인사평가 문서 감정 분석 및 워드클라우드 생성 시스템"
readme = "README_PACKAGE.md"
license-files = ["LICENSE"]
license = "LicenseRef-Proprietary"
requires-python = ">=3.10"

authors = [
    { name = "WordCloud Team" }
]

dependencies = [
    "flask>=3.1",
    "python-dotenv>=1.1",
    "torch>=2.6",
    "transformers>=4.57",
    "kiwipiepy>=0.22",
    "kiwipiepy-model>=0.22",
    "numpy>=2.2",
    "pandas>=2.3",
    "matplotlib>=3.10",
    "wordcloud>=1.9",
    "pillow>=12.0",
    "psutil>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-flask>=1.3",
]

prod = [
    "gunicorn>=23.0",
]

[project.urls]
Homepage = "https://github.com/anomalyco/wordcloud"

[project.scripts]
wordcloud-server = "web.app:main"
wordcloud-wsgi = "web.app:create_app"

[tool.setuptools]
packages = { find = { where = ["."], include = ["src*", "web*", "utils*"] } }

[tool.setuptools.package-data]
"web" = [
    "templates/**/*",
    "static/**/*",
]
"src" = [
    "configs/**/*",
]
