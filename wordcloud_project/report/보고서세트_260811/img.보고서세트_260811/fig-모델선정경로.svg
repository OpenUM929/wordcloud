<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/>
    </marker>
    <marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0553f"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>

  <text x="30" y="34" font-size="16" font-weight="bold" fill="#20262e">모델 선정 판단의 경로 — 성적보다 「뒤바뀜 0」이 먼저다</text>
  <text x="30" y="55" font-size="12.5" fill="#5a6472">다섯 후보를 같은 조건으로 학습해 같은 시험지 네 장으로 채점했습니다.</text>

  <!-- 1단계: 후보 -->
  <rect x="24" y="74" width="852" height="96" rx="6" fill="#fafbfc" stroke="#d5d9de"/>
  <text x="40" y="96" font-size="13" font-weight="bold" fill="#3c4652">① 후보</text>

  <rect x="40" y="106" width="152" height="50" rx="4" fill="#e8f1ec" stroke="#8fbfa6"/>
  <text x="116" y="126" font-size="12.5" text-anchor="middle" fill="#20262e" font-weight="bold">7/8 판</text>
  <text x="116" y="143" font-size="11" text-anchor="middle" fill="#5a6472">현행 운영본</text>

  <rect x="204" y="106" width="152" height="50" rx="4" fill="#eef0f3" stroke="#c2c8d0"/>
  <text x="280" y="126" font-size="12.5" text-anchor="middle" fill="#20262e">검수 정답 추가</text>
  <text x="280" y="143" font-size="11" text-anchor="middle" fill="#5a6472">+312건</text>

  <rect x="368" y="106" width="152" height="50" rx="4" fill="#eef0f3" stroke="#c2c8d0"/>
  <text x="444" y="126" font-size="12.5" text-anchor="middle" fill="#20262e">규칙 정답 대량</text>
  <text x="444" y="143" font-size="11" text-anchor="middle" fill="#5a6472">+2,024건</text>

  <rect x="532" y="106" width="152" height="50" rx="4" fill="#eef0f3" stroke="#c2c8d0"/>
  <text x="608" y="126" font-size="12.5" text-anchor="middle" fill="#20262e">3배 큰 모델</text>
  <text x="608" y="143" font-size="11" text-anchor="middle" fill="#5a6472">1.1억 → 3.4억</text>

  <rect x="696" y="106" width="164" height="50" rx="4" fill="#eef0f3" stroke="#c2c8d0"/>
  <text x="778" y="126" font-size="12.5" text-anchor="middle" fill="#20262e">3배 + 대량 데이터</text>
  <text x="778" y="143" font-size="11" text-anchor="middle" fill="#5a6472">커리큘럼 학습</text>

  <line x1="450" y1="170" x2="450" y2="196" stroke="#5a6472" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 2단계: 1차 관문 -->
  <rect x="24" y="200" width="852" height="78" rx="6" fill="#fdf6f4" stroke="#e0b7ab"/>
  <text x="40" y="222" font-size="13" font-weight="bold" fill="#3c4652">② 1차 관문 — 칭찬↔불만 뒤바뀜이 0인가</text>
  <text x="40" y="244" font-size="12" fill="#5a6472">뒤바뀜이 나오면 정확도가 아무리 높아도 탈락입니다. 이 오류는 사람에 대한 평가를 정반대로 뒤집기 때문입니다.</text>
  <text x="40" y="264" font-size="12" fill="#8b929c">채점 대상 — 시험지 네 장, 파일 762행 중 761건</text>

  <line x1="240" y1="278" x2="240" y2="312" stroke="#2f7a55" stroke-width="1.8" marker-end="url(#aro)"/>
  <text x="252" y="300" font-size="12" fill="#2f7a55" font-weight="bold">통과 (뒤바뀜 0)</text>

  <line x1="640" y1="278" x2="640" y2="312" stroke="#c0553f" stroke-width="1.8" marker-end="url(#arx)"/>
  <text x="652" y="300" font-size="12" fill="#c0553f" font-weight="bold">뒤바뀜 발생 → 탈락</text>

  <!-- 3단계: 좌 통과 -->
  <rect x="24" y="316" width="420" height="122" rx="6" fill="#f2f8f4" stroke="#8fbfa6"/>
  <text x="40" y="338" font-size="13" font-weight="bold" fill="#2f7a55">③ 통과한 후보만 성적 비교</text>
  <text x="40" y="360" font-size="12" fill="#3c4652">통과한 것은 <tspan font-weight="bold">7/8 판 하나뿐</tspan>이었습니다.</text>
  <text x="40" y="382" font-size="12" fill="#3c4652">네 장 성적 — 97.7 / 90.7 / 76.5 / 83.8</text>
  <text x="40" y="404" font-size="12" fill="#3c4652">네 장 <tspan font-weight="bold">중 셋에서 우위</tspan>. 남은 한 칸은 재측정에서 뒤집혔습니다.</text>
  <text x="40" y="426" font-size="11.5" fill="#8b929c">단위 %. 네 시험지는 성격이 달라 평균 내지 않습니다.</text>

  <!-- 3단계: 우 실격 -->
  <rect x="456" y="316" width="420" height="122" rx="6" fill="#fdf6f4" stroke="#e0b7ab"/>
  <text x="472" y="338" font-size="13" font-weight="bold" fill="#c0553f">③′ 탈락한 넷</text>
  <text x="472" y="360" font-size="12" fill="#3c4652">규칙 정답 대량 — 뒤바뀜 <tspan font-weight="bold">9건</tspan></text>
  <text x="472" y="382" font-size="12" fill="#3c4652">3배 큰 모델 · 3배+대량 — 각 <tspan font-weight="bold">4건</tspan></text>
  <text x="472" y="404" font-size="12" fill="#3c4652">검수 정답 추가 — 재측정서 <tspan font-weight="bold">2건</tspan>, 목표 이득 <tspan font-weight="bold">0</tspan></text>
  <text x="472" y="426" font-size="11.5" fill="#8b929c">성능을 올리려 한 시도가 가장 위험한 오류를 불렀습니다.</text>

  <line x1="234" y1="438" x2="234" y2="466" stroke="#2f7a55" stroke-width="1.8" marker-end="url(#aro)"/>

  <!-- 4단계: 결론 -->
  <rect x="24" y="470" width="852" height="70" rx="6" fill="#e8f1ec" stroke="#2f7a55"/>
  <text x="40" y="497" font-size="14" font-weight="bold" fill="#20262e">④ 결론 — 7월 8일 판을 유지하고 동결(2026-07-15)</text>
  <text x="40" y="522" font-size="12.5" fill="#3c4652">더 나은 것을 못 만든 것이 아니라, 만들어 비교한 결과 여섯 가지가 모두 이 판에 졌습니다.</text>
</svg>
