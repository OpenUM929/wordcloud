{% extends "base.html" %}
{% block title %}관리자 로그인{% endblock %}
{% block content %}
<h1>관리자 로그인</h1>
<div style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
  <div id="loginError" style="color: red; margin-bottom: 10px; display: none;"></div>
  <div style="margin-bottom: 15px;">
    <label>관리자 비밀번호:</label>
    <input type="password" id="adminPassword" style="width: 100%; padding: 8px; margin-top: 5px;">
  </div>
  <button class="btn btn-primary" onclick="adminLogin()" style="width: 100%;">로그인</button>
</div>
<script>
function adminLogin() {
  var pw = document.getElementById('adminPassword').value;
  fetch('/admin/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: pw})
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success) {
      window.location.href = '/admin/dashboard';
    } else {
      var err = document.getElementById('loginError');
      err.textContent = d.error || '로그인 실패';
      err.style.display = 'block';
    }
  })
  .catch(function() {
    var err = document.getElementById('loginError');
    err.textContent = '로그인 중 오류가 발생했습니다.';
    err.style.display = 'block';
  });
}
document.getElementById('adminPassword').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') adminLogin();
});
</script>
{% endblock %}
