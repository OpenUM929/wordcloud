{% extends "base.html" %}
{% block title %}전사 욕설 리스트 — Admin{% endblock %}
{% block extra_head %}
<style>
.filter-bar {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
}
.filter-bar input, .filter-bar select {
    padding: 5px 10px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
}
.filter-bar button {
    padding: 5px 14px;
    font-size: 13px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
.btn-apply { background: #6366f1; color: white; }
.btn-apply:hover { background: #0069d9; }
.btn-csv { background: #28a745; color: white; }
.btn-csv:hover { background: #218838; }

.profanity-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: white;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    overflow: hidden;
}
.profanity-table th {
    background: #f8f9fa;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    color: #333;
    border-bottom: 1px solid #dee2e6;
}
.profanity-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #e9ecef;
    vertical-align: top;
}
/* Column width constraints */
.profanity-table th:nth-child(1), .profanity-table td:nth-child(1) { width: 90px; min-width: 90px; max-width: 120px; }
.profanity-table th:nth-child(2), .profanity-table td:nth-child(2) { width: 100px; min-width: 100px; max-width: 140px; }
.profanity-table th:nth-child(3), .profanity-table td:nth-child(3) { width: 120px; min-width: 120px; max-width: 160px; }
.profanity-table th:nth-child(4), .profanity-table td:nth-child(4) { width: 70px; min-width: 70px; max-width: 90px; text-align: center; }
.profanity-table th:nth-child(5), .profanity-table td:nth-child(5) { width: 70px; min-width: 70px; max-width: 90px; text-align: center; }
.profanity-table th:nth-child(6), .profanity-table td:nth-child(6) { width: 60px; min-width: 60px; max-width: 80px; text-align: center; }
.profanity-table th:nth-child(7), .profanity-table td:nth-child(7) { min-width: 140px; max-width: 280px; }
.profanity-table th:nth-child(8), .profanity-table td:nth-child(8) { width: 80px; min-width: 80px; max-width: 100px; text-align: center; }
.profanity-table .badge-danger {
    display: inline-block;
    background: #f8d7da;
    color: #721c24;
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 11px;
    margin: 1px;
}
.profanity-table .metric {
    font-weight: 700;
    color: #dc3545;
}
.profanity-table .ratio {
    font-size: 11px;
    color: #666;
}
.word-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
}
.word-tags span {
    display: inline-block;
    background: #e9ecef;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
    color: #555;
}
.pagination {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 16px 0;
}
.pagination button {
    padding: 4px 10px;
    font-size: 12px;
    border: 1px solid #dee2e6;
    background: white;
    cursor: pointer;
    border-radius: 4px;
}
.pagination button.active { background: #6366f1; color: white; border-color: #6366f1; }
.pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.modal-overlay.open { display: flex; }
#sentenceModal .profanity-modal-box {
    background: #ffffff;
    border-radius: 8px;
    padding: 20px;
    width: 800px;
    max-width: 90vw;
    max-height: 80vh;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    overflow: auto;
    position: relative;
}
.modal-close {
    float: right;
    cursor: pointer;
    font-size: 22px;
    color: #999;
    background: none;
    border: none;
}
.modal-close:hover { color: #333; }
.sentence-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 10px;
}
.sentence-table th {
    background: #f8f9fa;
    padding: 6px 10px;
    border-bottom: 1px solid #dee2e6;
    text-align: left;
}
.sentence-table td {
    padding: 6px 10px;
    border-bottom: 1px solid #e9ecef;
}
.sentence-table .highlight {
    color: #dc3545;
    font-weight: 600;
}
.sentence-table mark {
    background: #ffcccc;
    color: #c00;
    padding: 0 2px;
    border-radius: 2px;
    font-weight: bold;
}
.word-badge {
    display: inline-block;
    background: #dc3545;
    color: white;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    margin: 1px;
}
.summary-bar {
    display: flex;
    gap: 16px;
    padding: 8px 14px;
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 13px;
}
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h1 style="margin:0;">🚨 전사 욕설 리스트</h1>
        <span style="font-size:12px;color:#666;">Admin 전용</span>
    </div>

    <div class="summary-bar">
        <span>총 <strong id="totalCount">0</strong>명</span>
        <span>페이지 <strong id="pageInfo">1/1</strong></span>
    </div>

    <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="직원명/사번 검색" style="width:160px;">
        <select id="deptSelect">
            <option value="">모든 부서</option>
        </select>
        <input type="number" id="minCountInput" placeholder="최소 욕설 수" value="1" min="1" style="width:110px;">
        <select id="sortSelect">
            <option value="count">욕설 건수</option>
            <option value="ratio">욕설 비율</option>
            <option value="name">직원명</option>
        </select>
        <select id="orderSelect">
            <option value="desc">내림차순</option>
            <option value="asc">오름차순</option>
        </select>
        <button class="btn-apply" onclick="loadData()">조회</button>
        <button class="btn-csv" onclick="downloadCsv()">CSV 다운로드</button>
    </div>

    <table class="profanity-table">
        <thead>
            <tr>
                <th>사번</th>
                <th>이름</th>
                <th>부서</th>
                <th>총 평가</th>
                <th>욕설 건수</th>
                <th>비율</th>
                <th>감지 단어</th>
                <th>액션</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="8" style="text-align:center;color:#999;padding:40px;">데이터를 조회하세요.</td></tr>
        </tbody>
    </table>

    <div class="pagination" id="pagination"></div>
</div>

<!-- Sentence Modal -->
<div class="modal-overlay" id="sentenceModal" onclick="if(event.target===this)closeModal()">
    <div class="profanity-modal-box">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <h3 style="margin:0 0 10px 0;font-size:16px;">📋 욕설 문장 상세</h3>
        <div id="modalBody"></div>
    </div>
</div>

<script>
let currentPage = 1;
let currentLimit = 50;
let currentData = null;

async function loadDepartments() {
    try {
        const res = await fetch('/api/perspective/profanity-list/departments');
        const d = await res.json();
        if (d.success) {
            const sel = document.getElementById('deptSelect');
            d.departments.forEach(function(dept) {
                const opt = document.createElement('option');
                opt.value = dept;
                opt.textContent = dept;
                sel.appendChild(opt);
            });
        }
    } catch(e) {
        console.error('부서 로드 실패:', e);
    }
}

async function loadData(page) {
    page = page || 1;
    currentPage = page;
    const search = document.getElementById('searchInput').value;
    const department = document.getElementById('deptSelect').value;
    const minCount = document.getElementById('minCountInput').value;
    const sort = document.getElementById('sortSelect').value;
    const order = document.getElementById('orderSelect').value;

    const params = new URLSearchParams({
        search: search,
        department: department,
        min_count: minCount,
        sort: sort,
        order: order,
        page: page,
        limit: currentLimit,
    });

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;">⏳ 로딩 중...</td></tr>';

    try {
        const res = await fetch('/api/perspective/profanity-list?' + params.toString());
        const d = await res.json();
        if (!d.success) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#dc3545;padding:40px;">조회 실패: ' + (d.error || '') + '</td></tr>';
            return;
        }
        currentData = d;
        renderTable(d.items);
        document.getElementById('totalCount').textContent = d.total;
        const totalPages = Math.ceil(d.total / currentLimit);
        document.getElementById('pageInfo').textContent = page + '/' + totalPages;
        renderPagination(page, totalPages);
    } catch(e) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#dc3545;padding:40px;">네트워크 오류</td></tr>';
    }
}

function renderTable(items) {
    const tbody = document.getElementById('tableBody');
    if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;padding:40px;">데이터가 없습니다.</td></tr>';
        return;
    }
    let h = '';
    items.forEach(function(item) {
        const ratio = (item.profanity_ratio * 100).toFixed(1);
        const words = (item.profanity_words || []).slice(0, 5).map(function(w) {
            return '<span>' + escapeHtml(w) + '</span>';
        }).join('');
        h += '<tr>';
        h += '<td>' + escapeHtml(item.employee_id) + '</td>';
        h += '<td>' + escapeHtml(item.name) + '</td>';
        h += '<td>' + escapeHtml(item.department) + '</td>';
        h += '<td>' + item.total_evaluations + '</td>';
        h += '<td class="metric">' + item.profanity_count + '</td>';
        h += '<td class="ratio">' + ratio + '%</td>';
        h += '<td><div class="word-tags">' + words + '</div></td>';
        h += '<td><button style="padding:3px 10px;background:#6366f1;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;" onclick="openDetail(\'' + item.employee_id + '\')">상세 보기</button></td>';
        h += '</tr>';
    });
    tbody.innerHTML = h;
}

function renderPagination(page, totalPages) {
    const div = document.getElementById('pagination');
    if (totalPages <= 1) {
        div.innerHTML = '';
        return;
    }
    let h = '';
    h += '<button ' + (page <= 1 ? 'disabled' : '') + ' onclick="loadData(' + (page - 1) + ')">&lt;</button>';
    for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= page - 2 && i <= page + 2)) {
            h += '<button class="' + (i === page ? 'active' : '') + '" onclick="loadData(' + i + ')">' + i + '</button>';
        } else if (i === page - 3 || i === page + 3) {
            h += '<span>...</span>';
        }
    }
    h += '<button ' + (page >= totalPages ? 'disabled' : '') + ' onclick="loadData(' + (page + 1) + ')">&gt;</button>';
    div.innerHTML = h;
}

async function openDetail(employeeId) {
    const body = document.getElementById('modalBody');
    const modal = document.getElementById('sentenceModal');
    body.innerHTML = '<p style="text-align:center;">⏳ 로딩 중...</p>';
    modal.classList.add('open');

    try {
        const res = await fetch('/api/perspective/profanity-list/sentences/' + encodeURIComponent(employeeId));
        const d = await res.json();
        if (!d.success || !d.sentences || d.sentences.length === 0) {
            body.innerHTML = '<p style="text-align:center;color:#999;">문장이 없습니다.</p>';
            return;
        }

        let h = '<table class="sentence-table">';
        h += '<thead><tr><th style="width:30px;">No</th><th>원본 문장</th><th>필터링</th><th>감지 단어</th><th>평가자</th></tr></thead>';
        h += '<tbody>';
        d.sentences.forEach(function(s, idx) {
            const words = (s.detected_words || []);
            const wordBadges = words.map(function(w) {
                return '<span class="word-badge">' + escapeHtml(w) + '</span>';
            }).join(' ');
            h += '<tr>';
            h += '<td>' + (idx + 1) + '</td>';
            h += '<td>' + highlightProfanity(s.original_text, words) + '</td>';
            h += '<td>' + escapeHtml(s.filtered_text) + '</td>';
            h += '<td>' + wordBadges + '</td>';
            h += '<td>' + escapeHtml(s.evaluator_id) + '</td>';
            h += '</tr>';
        });
        h += '</tbody></table>';
        body.innerHTML = h;
    } catch(e) {
        body.innerHTML = '<p style="text-align:center;color:#dc3545;">오류 발생</p>';
    }
}

function highlightProfanity(text, words) {
    if (!text || !words || !words.length) return escapeHtml(text);
    let html = escapeHtml(text);
    words.forEach(function(w) {
        const escaped = escapeHtml(w);
        html = html.split(escaped).join('<mark style="background:#ffcccc;color:#c00;padding:0 2px;border-radius:2px;font-weight:bold;">' + escaped + '</mark>');
    });
    return html;
}

function closeModal() {
    document.getElementById('sentenceModal').classList.remove('open');
}

function downloadCsv() {
    const search = document.getElementById('searchInput').value;
    const department = document.getElementById('deptSelect').value;
    const minCount = document.getElementById('minCountInput').value;
    const sort = document.getElementById('sortSelect').value;
    const order = document.getElementById('orderSelect').value;

    const params = new URLSearchParams({
        search: search,
        department: department,
        min_count: minCount,
        sort: sort,
        order: order,
    });
    window.location.href = '/api/perspective/profanity-list/csv?' + params.toString();
}

function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

loadDepartments();
loadData(1);
</script>
{% endblock %}
