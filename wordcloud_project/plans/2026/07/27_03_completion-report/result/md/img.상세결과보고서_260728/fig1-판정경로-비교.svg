<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/>
    </marker>
    <marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0b6bf"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- ── 종전 방식 ── -->
  <rect x="12" y="14" width="876" height="186" rx="6" fill="#fafbfc" stroke="#d5d9de"/>
  <text x="30" y="42" font-size="16" font-weight="bold" fill="#20262e">종전 방식 — 문장을 읽지 않고 기입 칸으로만 정함</text>
  <text x="30" y="63" font-size="12.5" fill="#5a6472">중립이라는 항목 자체가 없었습니다.</text>

  <rect x="30" y="80" width="176" height="46" rx="4" fill="#eef0f3" stroke="#c2c8d0"/>
  <text x="118" y="99" font-size="13" text-anchor="middle" fill="#3c4652">평가 문장</text>
  <text x="118" y="116" font-size="11.5" text-anchor="middle" fill="#8b929c">읽지 않음</text>
  <line x1="206" y1="103" x2="286" y2="103" stroke="#b0b6bf" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arx)"/>
  <text x="246" y="94" font-size="11" text-anchor="middle" fill="#a0a6b0">사용 안 함</text>

  <rect x="30" y="140" width="176" height="42" rx="4" fill="#e8edf4" stroke="#9fb0c8"/>
  <text x="118" y="166" font-size="13" text-anchor="middle" fill="#2b3a4d">기입 칸 (장점 / 단점)</text>
  <path d="M206,161 L246,161 L246,103 L286,103" fill="none" stroke="#5a6472" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="290" y="82" width="150" height="42" rx="4" fill="#eef0f3" stroke="#c2c8d0"/>
  <text x="365" y="108" font-size="13" text-anchor="middle" fill="#3c4652">칸 → 극성 대응</text>

  <line x1="440" y1="103" x2="516" y2="103" stroke="#5a6472" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="520" y="76" width="150" height="36" rx="4" fill="#e6f0e8" stroke="#8fb79b"/>
  <text x="595" y="99" font-size="13" text-anchor="middle" fill="#2c4a34">장점 칸 → 칭찬</text>
  <rect x="520" y="120" width="150" height="36" rx="4" fill="#f6e8e8" stroke="#c99a9a"/>
  <text x="595" y="143" font-size="13" text-anchor="middle" fill="#5c2b2b">단점 칸 → 불만</text>

  <rect x="694" y="76" width="176" height="80" rx="4" fill="#ffffff" stroke="#d5d9de" stroke-dasharray="4 3"/>
  <text x="782" y="103" font-size="13" text-anchor="middle" fill="#8b929c">중립 없음</text>
  <text x="782" y="126" font-size="11.5" text-anchor="middle" fill="#a0a6b0">「보완필요점 없습니다」도</text>
  <text x="782" y="142" font-size="11.5" text-anchor="middle" fill="#a0a6b0">불만으로 집계</text>

  <!-- ── 현행 방식 ── -->
  <rect x="12" y="216" width="876" height="240" rx="6" fill="#fafbfc" stroke="#d5d9de"/>
  <text x="30" y="244" font-size="16" font-weight="bold" fill="#20262e">현행 방식 — 문장을 읽고, 기입 칸은 참고 신호로 함께 넣음</text>
  <text x="30" y="265" font-size="12.5" fill="#5a6472">칭찬·중립·불만 3분류로 판정하고, 판정마다 확신도를 함께 출력합니다.</text>

  <rect x="30" y="286" width="152" height="40" rx="4" fill="#eef0f3" stroke="#c2c8d0"/>
  <text x="106" y="311" font-size="13" text-anchor="middle" fill="#3c4652">평가 문장</text>
  <rect x="30" y="342" width="152" height="40" rx="4" fill="#e8edf4" stroke="#9fb0c8"/>
  <text x="106" y="367" font-size="13" text-anchor="middle" fill="#2b3a4d">기입 칸 (장점 / 단점)</text>

  <path d="M182,306 L214,306 L214,334 L242,334" fill="none" stroke="#5a6472" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M182,362 L214,362 L214,334 L242,334" fill="none" stroke="#5a6472" stroke-width="1.8"/>

  <rect x="246" y="310" width="164" height="48" rx="4" fill="#eef0f3" stroke="#c2c8d0"/>
  <text x="328" y="331" font-size="12.5" text-anchor="middle" fill="#3c4652">입력 결합</text>
  <text x="328" y="349" font-size="11.5" text-anchor="middle" fill="#6b7482">「장점 평가: 」 + 문장</text>

  <line x1="410" y1="334" x2="440" y2="334" stroke="#5a6472" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="444" y="304" width="176" height="60" rx="4" fill="#e8edf4" stroke="#9fb0c8"/>
  <text x="532" y="327" font-size="12.5" text-anchor="middle" fill="#2b3a4d">인사평가 전용</text>
  <text x="532" y="345" font-size="12.5" text-anchor="middle" fill="#2b3a4d">3분류 판정 모델</text>
  <text x="532" y="359" font-size="10.5" text-anchor="middle" fill="#6b7482">확신도 눈금 보정 포함</text>

  <line x1="620" y1="334" x2="650" y2="334" stroke="#5a6472" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="654" y="286" width="120" height="34" rx="4" fill="#e6f0e8" stroke="#8fb79b"/>
  <text x="714" y="308" font-size="13" text-anchor="middle" fill="#2c4a34">칭찬</text>
  <rect x="654" y="326" width="120" height="34" rx="4" fill="#eef0f3" stroke="#b8bec6"/>
  <text x="714" y="348" font-size="13" text-anchor="middle" fill="#3c4652">중립</text>
  <rect x="654" y="366" width="120" height="34" rx="4" fill="#f6e8e8" stroke="#c99a9a"/>
  <text x="714" y="388" font-size="13" text-anchor="middle" fill="#5c2b2b">불만·개선요청</text>

  <rect x="790" y="286" width="80" height="114" rx="4" fill="#ffffff" stroke="#d5d9de" stroke-dasharray="4 3"/>
  <text x="830" y="333" font-size="12" text-anchor="middle" fill="#6b7482">확신도</text>
  <text x="830" y="352" font-size="12" text-anchor="middle" fill="#6b7482">0~1</text>

  <text x="30" y="424" font-size="11.5" fill="#8b929c">기입 칸은 판정을 덮어쓰는 규칙이 아니라, 모델이 함께 읽는 입력 신호입니다. 후처리로 칸 극성을 다시 씌우는 방식은 실측 후 폐기했습니다(§4-1).</text>
  <text x="30" y="443" font-size="11.5" fill="#8b929c">근거: §4-1 판정 함수의 형식적 정의 (제2부 부록)</text>
</svg>
