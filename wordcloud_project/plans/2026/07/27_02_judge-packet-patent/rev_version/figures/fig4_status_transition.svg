<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="480" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">[그림 4] 이원 상태 코드 전이도 — 처리 주체(AI/사람) × 처리 단계(대기 → 작업 완료 → 반영 완료)</text>

  <!-- column headers -->
  <text x="112" y="72" font-size="12.5" font-weight="700" fill="#7b8ba1" text-anchor="middle">판정 대기</text>
  <text x="392" y="72" font-size="12.5" font-weight="700" fill="#7b8ba1" text-anchor="middle">작업 완료(DB 반영 대기)</text>
  <text x="900" y="72" font-size="12.5" font-weight="700" fill="#7b8ba1" text-anchor="middle">DB 반영 완료</text>

  <!-- nodes -->
  <rect x="34" y="180" width="156" height="60" rx="10" fill="#eef2f7" stroke="#5a7fa6" stroke-width="1.6"/>
  <text x="112" y="205" font-size="15" font-weight="700" fill="#2c4661" text-anchor="middle">1</text>
  <text x="112" y="226" font-size="12" fill="#3b4756" text-anchor="middle">AI 판정 대기(추출 직후)</text>

  <rect x="314" y="100" width="156" height="60" rx="10" fill="#fdf3e3" stroke="#c98a2e" stroke-width="1.6"/>
  <text x="392" y="125" font-size="15" font-weight="700" fill="#a8761f" text-anchor="middle">3</text>
  <text x="392" y="146" font-size="12" fill="#3b4756" text-anchor="middle">AI 작업 완료</text>

  <rect x="314" y="290" width="156" height="60" rx="10" fill="#eef7ef" stroke="#4c8c5a" stroke-width="1.6"/>
  <text x="392" y="315" font-size="15" font-weight="700" fill="#3f7a4f" text-anchor="middle">2</text>
  <text x="392" y="336" font-size="12" fill="#3b4756" text-anchor="middle">사람 판정 대기(게시판)</text>

  <rect x="600" y="290" width="156" height="60" rx="10" fill="#eef7ef" stroke="#4c8c5a" stroke-width="1.6"/>
  <text x="678" y="315" font-size="15" font-weight="700" fill="#3f7a4f" text-anchor="middle">4</text>
  <text x="678" y="336" font-size="12" fill="#3b4756" text-anchor="middle">Human 작업 완료</text>

  <rect x="822" y="100" width="156" height="60" rx="10" fill="#f2eef7" stroke="#7a5aa6" stroke-width="1.6"/>
  <text x="900" y="125" font-size="15" font-weight="700" fill="#6b4f96" text-anchor="middle">10</text>
  <text x="900" y="146" font-size="12" fill="#3b4756" text-anchor="middle">AI DB 반영 완료</text>

  <rect x="822" y="290" width="156" height="60" rx="10" fill="#f2eef7" stroke="#7a5aa6" stroke-width="1.6"/>
  <text x="900" y="315" font-size="15" font-weight="700" fill="#6b4f96" text-anchor="middle">11</text>
  <text x="900" y="336" font-size="12" fill="#3b4756" text-anchor="middle">Human DB 반영 완료</text>

  <!-- edges -->
  <path d="M190,196 L250,196 L250,130 L308,130" fill="none" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#a4)"/>
  <text x="304" y="114" font-size="11.5" fill="#a8761f" text-anchor="end">외부 AI가 긍↔부 확신</text>

  <path d="M190,224 L250,224 L250,320 L308,320" fill="none" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#a4)"/>
  <text x="244" y="282" font-size="11.5" fill="#3f7a4f" text-anchor="end">확신 없음 → 사람 이관</text>

  <line x1="470" y1="320" x2="594" y2="320" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#a4)"/>
  <text x="532" y="310" font-size="11.5" fill="#3f7a4f" text-anchor="middle">게시판 결정값</text>
  <text x="532" y="344" font-size="11.5" fill="#7b8ba1" text-anchor="middle">(감정 3분류일 때만)</text>

  <path d="M392,290 C392,250 470,244 470,282" fill="none" stroke="#8fa3bb" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a4)"/>
  <text x="300" y="238" font-size="11.5" fill="#7b8ba1">not_group · skip → 결정값은 기록, 상태 2 유지(반영 제외)</text>

  <line x1="470" y1="130" x2="816" y2="130" stroke="#7a5aa6" stroke-width="1.8" marker-end="url(#a4)"/>
  <text x="643" y="120" font-size="11.5" fill="#6b4f96" text-anchor="middle">"DB에 반영"(대상: AI분)</text>

  <line x1="756" y1="320" x2="816" y2="320" stroke="#7a5aa6" stroke-width="1.8" marker-end="url(#a4)"/>
  <text x="786" y="368" font-size="11.5" fill="#6b4f96" text-anchor="middle">"DB에 반영"(대상: 사람분)</text>

  <!-- note -->
  <rect x="34" y="396" width="1032" height="62" rx="8" fill="#f7f9fc" stroke="#c3cfdd"/>
  <text x="54" y="420" font-size="12.5" fill="#3b4756">· 작업 완료(3 · 4)는 라벨을 보유하지만 <tspan font-weight="700">데이터베이스에 기록되지 않는다</tspan> — 운영자가 확정 조작을 한 시점에만 기록되고 10 · 11로 전이한다(반영 지연 = 검증 공백 방지).</text>
  <text x="54" y="444" font-size="12.5" fill="#3b4756">· 판정 데이터 구조를 다시 업로드해 재적용해도 이미 반영 완료(10 · 11)인 항목만 멱등 재기록되므로 중복 반영이 발생하지 않는다.</text>
</svg>
