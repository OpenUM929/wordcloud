<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="m8a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7f"/>
    </marker>
    <marker id="m8r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#a2504d"/>
    </marker>
    <marker id="m8g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4c8c5a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="460" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">[그림 6] 판정 곤란 문장 추출 단계 흐름도 — 2회 분기로 위임 대상만 항목화</text>

  <!-- (1) 대상 로드 -->
  <rect x="24" y="90" width="180" height="104" rx="8" fill="#eef2f7" stroke="#5a7fa6" stroke-width="1.5"/>
  <text x="114" y="112" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">① 대상 로드</text>
  <text x="114" y="132" font-size="11" fill="#3b4756" text-anchor="middle">배치 식별자 조건 조회</text>
  <text x="114" y="150" font-size="11" fill="#3b4756" text-anchor="middle">가명 레코드 원복 없이 사용</text>
  <text x="114" y="168" font-size="11" fill="#8a94a6" text-anchor="middle">본문 없음·손상 레코드 스킵</text>

  <!-- (2) 문장 분해 -->
  <rect x="240" y="90" width="200" height="104" rx="8" fill="#eef2f7" stroke="#5a7fa6" stroke-width="1.5"/>
  <text x="340" y="112" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">② 문장 분해·이중 판정</text>
  <text x="340" y="132" font-size="11" fill="#3b4756" text-anchor="middle">제1 극성 판정값 = 스코어 부호</text>
  <text x="340" y="150" font-size="11" fill="#3b4756" text-anchor="middle">제2 극성 판정값 = 원확률 argmax</text>
  <text x="340" y="168" font-size="11" fill="#8a94a6" text-anchor="middle">저장값 우선, 없을 때만 즉석 계산</text>

  <!-- (3) 판정 곤란 문장 판별 (decision) -->
  <rect x="476" y="80" width="212" height="124" rx="8" fill="#fdf3e3" stroke="#c98a2e" stroke-width="1.5"/>
  <text x="582" y="102" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">③ 판정 곤란 문장 판별</text>
  <text x="582" y="122" font-size="11" fill="#3b4756" text-anchor="middle">{긍정,부정} 집합일치 = 극성불일치</text>
  <text x="582" y="140" font-size="11" fill="#3b4756" text-anchor="middle">확률차 &lt; 임계값 = 저마진</text>
  <text x="582" y="158" font-size="11" fill="#8a94a6" text-anchor="middle">기존 보정값·빈 문자열은 사전 제외</text>
  <text x="582" y="178" font-size="11" fill="#a8761f" text-anchor="middle">해당 없음 → 위임하지 않음</text>

  <!-- reject 1 -->
  <rect x="476" y="240" width="212" height="52" rx="8" fill="#fdf4f4" stroke="#d59896" stroke-width="1.2"/>
  <text x="582" y="262" font-size="12" fill="#a2504d" text-anchor="middle">해당 없음</text>
  <text x="582" y="280" font-size="11" fill="#a2504d" text-anchor="middle">→ 항목화하지 않고 종료</text>

  <!-- (4) 개인정보 게이트 (decision) -->
  <rect x="726" y="80" width="212" height="124" rx="8" fill="#fdecec" stroke="#c0504d" stroke-width="1.5"/>
  <text x="832" y="102" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">④ 개인정보 게이트</text>
  <text x="832" y="122" font-size="11" fill="#3b4756" text-anchor="middle">주민번호·전화·이메일</text>
  <text x="832" y="140" font-size="11" fill="#3b4756" text-anchor="middle">6자리 이상 연속 숫자(4종 정규식)</text>
  <text x="832" y="160" font-size="11" fill="#8a94a6" text-anchor="middle">학습데이터 반출 정책과 동일 기준</text>
  <text x="832" y="180" font-size="11" fill="#a2504d" text-anchor="middle">적발 → 격리 목록</text>

  <!-- quarantine -->
  <rect x="726" y="240" width="212" height="52" rx="8" fill="#fdf4f4" stroke="#d59896" stroke-width="1.2"/>
  <text x="832" y="262" font-size="12" fill="#a2504d" text-anchor="middle">격리 목록</text>
  <text x="832" y="280" font-size="11" fill="#a2504d" text-anchor="middle">레코드ID·문장순번·적발유형 기록</text>

  <!-- (5) 항목 생성 -->
  <rect x="976" y="80" width="200" height="124" rx="8" fill="#eef7ef" stroke="#4c8c5a" stroke-width="1.5"/>
  <text x="1076" y="102" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">⑤ 항목 생성</text>
  <text x="1076" y="122" font-size="11" fill="#3b4756" text-anchor="middle">매칭키·반영키·문장원문</text>
  <text x="1076" y="140" font-size="11" fill="#3b4756" text-anchor="middle">확률3종·확률차·위임사유</text>
  <text x="1076" y="158" font-size="11" fill="#3b4756" text-anchor="middle">구간 표지·빈 출력 자리</text>
  <text x="1076" y="178" font-size="11" fill="#3f7a4f" text-anchor="middle">초기 상태 코드 1</text>

  <!-- arrows main line -->
  <line x1="204" y1="142" x2="236" y2="142" stroke="#5b6b7f" stroke-width="1.7" marker-end="url(#m8a)"/>
  <line x1="440" y1="142" x2="472" y2="142" stroke="#5b6b7f" stroke-width="1.7" marker-end="url(#m8a)"/>
  <line x1="688" y1="142" x2="722" y2="142" stroke="#c98a2e" stroke-width="1.7" marker-end="url(#m8a)"/>
  <text x="705" y="132" font-size="10.5" fill="#a8761f" text-anchor="middle">해당</text>
  <line x1="938" y1="142" x2="972" y2="142" stroke="#4c8c5a" stroke-width="1.7" marker-end="url(#m8g)"/>
  <text x="955" y="132" font-size="10.5" fill="#3f7a4f" text-anchor="middle">통과</text>

  <!-- branch to reject -->
  <path d="M582,204 L582,236" fill="none" stroke="#a2504d" stroke-width="1.6" marker-end="url(#m8r)"/>
  <!-- branch to quarantine -->
  <path d="M832,204 L832,236" fill="none" stroke="#a2504d" stroke-width="1.6" marker-end="url(#m8r)"/>

  <!-- pure function note -->
  <rect x="24" y="330" width="1152" height="70" rx="8" fill="#f7f9fc" stroke="#c3cfdd" stroke-width="1.2"/>
  <text x="44" y="354" font-size="12.5" fill="#1f2937" font-weight="700">비고 — 항목화 결과</text>
  <text x="44" y="376" font-size="12" fill="#3b4756">두 분기를 모두 통과한 문장만 판정 데이터 구조의 항목부(items[])로 생성되고, 격리된 문장은 항목부에 실리지 않은 채 봉투부 진행 상태에 건수로만 기록된다.</text>
  <text x="44" y="392" font-size="11.5" fill="#8a94a6">③·④ 두 번의 분기를 모두 통과한 문장만 ⑤에서 항목으로 생성되며, 이 항목들이 다음 단계(판정 데이터 구조 생성, 그림 7)의 items[] 로 전달된다.</text>
</svg>
