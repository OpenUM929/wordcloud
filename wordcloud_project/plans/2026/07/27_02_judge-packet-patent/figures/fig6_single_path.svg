<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="a5" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">[그림 6] 출처 무관 단일 반영 경로 — 판정 주체를 구분하는 조건 분기가 존재하지 않음</text>

  <!-- sources -->
  <rect x="24" y="82" width="228" height="72" rx="8" fill="#fdf3e3" stroke="#c98a2e" stroke-width="1.5"/>
  <text x="138" y="106" font-size="13" font-weight="700" fill="#a8761f" text-anchor="middle">외부 AI가 채운 결과</text>
  <text x="138" y="126" font-size="12" fill="#3b4756" text-anchor="middle">ai_reference.polarity</text>
  <text x="138" y="144" font-size="12" fill="#7b8ba1" text-anchor="middle">status = 3</text>

  <rect x="24" y="186" width="228" height="72" rx="8" fill="#eef7ef" stroke="#4c8c5a" stroke-width="1.5"/>
  <text x="138" y="210" font-size="13" font-weight="700" fill="#3f7a4f" text-anchor="middle">웹 검토 인터페이스가 채운 결과</text>
  <text x="138" y="230" font-size="12" fill="#3b4756" text-anchor="middle">human_decision</text>
  <text x="138" y="248" font-size="12" fill="#7b8ba1" text-anchor="middle">status = 4</text>

  <rect x="24" y="290" width="228" height="72" rx="8" fill="#f4f5f7" stroke="#a8b2bf" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="138" y="314" font-size="13" font-weight="700" fill="#6b7685" text-anchor="middle">구 형식 패킷</text>
  <text x="138" y="334" font-size="12" fill="#3b4756" text-anchor="middle">result.label / needs_human</text>
  <text x="138" y="352" font-size="12" fill="#7b8ba1" text-anchor="middle">status 필드 없음</text>

  <!-- funnel: resolve -->
  <rect x="322" y="112" width="266" height="230" rx="10" fill="#eef2f7" stroke="#5a7fa6" stroke-width="1.8"/>
  <text x="455" y="140" font-size="13.5" font-weight="700" fill="#2c4661" text-anchor="middle">상태 정규화 · 최종 라벨 결정</text>
  <text x="455" y="160" font-size="12" fill="#7b8ba1" text-anchor="middle">(단일 함수 경로)</text>

  <rect x="340" y="176" width="230" height="52" rx="6" fill="#ffffff" stroke="#c3cfdd"/>
  <text x="455" y="197" font-size="12.5" font-weight="700" fill="#2c4661" text-anchor="middle">상태 정규화</text>
  <text x="455" y="216" font-size="11.5" fill="#3b4756" text-anchor="middle">구 형식 → 1 / 2 / 3 / 4 로 사상</text>

  <rect x="340" y="240" width="230" height="86" rx="6" fill="#ffffff" stroke="#c3cfdd"/>
  <text x="455" y="261" font-size="12.5" font-weight="700" fill="#2c4661" text-anchor="middle">최종 라벨 = 필드 우선순위</text>
  <text x="356" y="284" font-size="12" fill="#3f7a4f">① human_decision (유효값이면 채택)</text>
  <text x="356" y="304" font-size="12" fill="#a8761f">② ai_reference.polarity</text>
  <text x="356" y="322" font-size="12" fill="#6b7685">③ result.label (구 형식)</text>

  <!-- filter -->
  <rect x="644" y="152" width="196" height="150" rx="10" fill="#f7f9fc" stroke="#5a7fa6" stroke-width="1.5"/>
  <text x="742" y="178" font-size="13" font-weight="700" fill="#2c4661" text-anchor="middle">확정 조작 시 대상 필터</text>
  <text x="742" y="202" font-size="12" fill="#3b4756" text-anchor="middle">AI분(3) / 사람분(4) / 전체</text>
  <text x="742" y="228" font-size="12" fill="#3b4756" text-anchor="middle">반영 키별 라벨 사전 구성</text>
  <text x="742" y="252" font-size="12" fill="#3b4756" text-anchor="middle">{ db_id: { sent_idx: label } }</text>
  <text x="742" y="278" font-size="11.5" fill="#7b8ba1" text-anchor="middle">상태 전이 3→10 · 4→11</text>

  <!-- merge -->
  <rect x="884" y="152" width="212" height="150" rx="10" fill="#f2eef7" stroke="#7a5aa6" stroke-width="1.6"/>
  <text x="990" y="178" font-size="13" font-weight="700" fill="#6b4f96" text-anchor="middle">기존 스키마 in-place 병합</text>
  <text x="990" y="202" font-size="12" fill="#3b4756" text-anchor="middle">기존 보정값 조회</text>
  <text x="990" y="224" font-size="12" fill="#3b4756" text-anchor="middle">{ 기존 } ← { 신규 } 우선 병합</text>
  <text x="990" y="246" font-size="12" fill="#3b4756" text-anchor="middle">단일 UPDATE 문 기록</text>
  <text x="990" y="272" font-size="11.5" fill="#7b8ba1" text-anchor="middle">신규 테이블 · 컬럼 0 · 멱등</text>

  <!-- arrows -->
  <path d="M252,118 L288,118 L288,208 L316,208" fill="none" stroke="#c98a2e" stroke-width="1.8" marker-end="url(#a5)"/>
  <line x1="252" y1="222" x2="316" y2="222" stroke="#4c8c5a" stroke-width="1.8" marker-end="url(#a5)"/>
  <path d="M252,326 L288,326 L288,236 L316,236" fill="none" stroke="#a8b2bf" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a5)"/>
  <line x1="588" y1="227" x2="638" y2="227" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#a5)"/>
  <line x1="840" y1="227" x2="878" y2="227" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#a5)"/>

  <!-- note -->
  <rect x="322" y="368" width="774" height="88" rx="8" fill="#f7f9fc" stroke="#c3cfdd"/>
  <text x="342" y="392" font-size="12.5" fill="#3b4756">· 외부 AI 결과와 사람 결과는 <tspan font-weight="700">같은 패킷의 같은 형식</tspan>이므로, "AI 결과 파싱기"와 "사람 입력 파싱기"를 이중으로 둘 필요가 없다.</text>
  <text x="342" y="416" font-size="12.5" fill="#3b4756">· 출처는 <tspan font-weight="700">상태 코드로만</tspan> 구분되며, 라벨 추출 · 병합 · 기록 처리 자체는 양쪽이 완전히 동일한 코드 경로를 통과한다.</text>
  <text x="342" y="440" font-size="12.5" fill="#3b4756">· 새 판정 수단(다른 모델, 다른 검토자)을 도입해도 이 경로는 변경되지 않는다 = 프로그램 수정 없는 통합.</text>

  <rect x="24" y="388" width="266" height="56" rx="8" fill="#fdf4f4" stroke="#d59896"/>
  <text x="157" y="412" font-size="12.5" font-weight="700" fill="#a2504d" text-anchor="middle">종래: 출처별 파싱 · 연계 코드</text>
  <text x="157" y="432" font-size="12" fill="#a2504d" text-anchor="middle">이원 유지 → 불일치 · 중복 반영 사고</text>
</svg>
